name: Build desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @framenote/core test
      - run: pnpm --filter @framenote/ui test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri -> target }
      - run: pnpm install --frozen-lockfile
      - name: Bundle ExifTool
        run: node scripts/fetch-exiftool.mjs --platform=${{ runner.os == 'Windows' && 'win32' || 'darwin' }}
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Frame Note ${{ github.ref_name }}"
          releaseBody: "Unsigned builds. See the README for how to open them on macOS and Windows."
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: framenote-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
