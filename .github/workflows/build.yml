name: Build and deploy

# - Push to main: run the tests and refresh the web app on GitHub Pages.
# - Push a tag like v0.1.0: build the .dmg and .exe and publish them as release v0.1.0.
# - Actions tab → "Build and deploy" → Run workflow: pick what to build. Desktop builds are published as a new
#   public release each time (v0.1.0-build.<run number>).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      desktop:
        description: "Build the macOS .dmg and Windows .exe"
        type: boolean
        default: true
      web:
        description: "Refresh the web app on GitHub Pages"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @fovea/core test
      - run: pnpm --filter @fovea/ui test

  web:
    needs: test
    # The github-pages environment only accepts deployments from the default branch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.web)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter @fovea/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  desktop:
    needs: test
    if: github.ref_type == 'tag' || inputs.desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-apple-silicon
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            arch: x64
          - platform: windows-latest
            target: i686-pc-windows-msvc
            label: windows-x86
            arch: x86
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri -> target }
      - run: pnpm install --frozen-lockfile
      - name: Bundle ExifTool
        run: node scripts/fetch-exiftool.mjs --platform=${{ runner.os == 'Windows' && 'win32' || 'darwin' }} --arch=${{ matrix.arch || 'x64' }}
      - name: Rust tests
        if: matrix.target != 'x86_64-apple-darwin' && matrix.target != 'i686-pc-windows-msvc'
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: fovea-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Publishes every installer that was built as a public release, so anyone can download it from the Releases page.
  # A tag push uses the tag (v0.1.0). A manual run gets its own release, v<app version>-build.<run number>.
  release:
    needs: desktop
    if: ${{ !cancelled() && needs.desktop.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: fovea-*, merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Each artifact keeps its bundle folder (dmg/ or nsis/), so search below dist/.
          shopt -s nullglob globstar
          files=(dist/**/*.dmg dist/**/*.exe)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No installers were built, so there is nothing to release."; exit 1; fi
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v${version}-build.${GITHUB_RUN_NUMBER}"; fi
          missing=""
          for p in "aarch64.dmg:macOS Apple silicon" "x64.dmg:macOS Intel" "x64-setup.exe:Windows 64-bit" "x86-setup.exe:Windows 32-bit"; do
            found=(dist/**/*"_${p%%:*}")
            [ ${#found[@]} -gt 0 ] || missing="$missing- ${p#*:}"$'\n'
          done
          {
            echo "Fovea $version, built from \`${GITHUB_SHA::7}\`. These builds are not signed."
            echo
            echo "| Download | For |"
            echo "|---|---|"
            echo "| \`…_aarch64.dmg\` | Mac with Apple silicon (M1 or later) |"
            echo "| \`…_x64.dmg\` | Mac with an Intel processor |"
            echo "| \`…_x64-setup.exe\` | Windows, 64-bit (most PCs) |"
            echo "| \`…_x86-setup.exe\` | Windows, 32-bit |"
            echo
            echo "**Mac:** open the .dmg and drag Fovea to Applications. Then run this once in Terminal:"
            echo '`xattr -dr com.apple.quarantine "/Applications/Fovea.app"`'
            echo
            echo "**Windows:** if SmartScreen appears, click **More info → Run anyway**."
            if [ -n "$missing" ]; then echo; echo "Not in this release because its build failed:"; printf '%s' "$missing"; fi
          } > notes.md
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fovea $tag" --notes-file notes.md --latest
