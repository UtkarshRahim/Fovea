[package]
name = "framenote"
version = "0.1.0"
description = "Frame Note — presentation and review for wildlife photographers"
authors = ["Utkarsh Rahim"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "framenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "rayon"] }
fast_image_resize = "5"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
